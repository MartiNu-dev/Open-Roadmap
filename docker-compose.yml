version: "3.9"

services:
  backend:
    build: ./backend
    container_name: roadmap-backend
    environment:
      SQLITE_PATH: "/app/data/app.db"
      JWT_SECRET: "${JWT_SECRET:-b7e9f1a4c8d2e6f0a1b3c5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f7}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      SEED_USER_EMAIL: "${SEED_USER_EMAIL:-user@example.com}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-user123}"
      SEED_EDITOR_EMAIL: "${SEED_EDITOR_EMAIL:-editor@example.com}"
      SEED_EDITOR_PASSWORD: "${SEED_EDITOR_PASSWORD:-editor123}"
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    container_name: roadmap-frontend
    environment:
      REACT_APP_BACKEND_URL: "http://localhost:8001"
      WDS_SOCKET_PORT: "0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlite_data:
